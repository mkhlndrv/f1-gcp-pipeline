name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff "dbt-bigquery==1.11.*"

      - name: Ruff lint (Python)
        run: ruff check extractors loaders dbt_runner

      - name: dbt parse (static SQL validation)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.github/dbt-ci
        run: dbt parse
