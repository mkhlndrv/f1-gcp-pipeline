version: 2

models:
  - name: dim_driver
    description: "One row per driver. Joined dim for the dashboard."
    columns:
      - name: driver_id
        description: "Ergast natural key (e.g. 'max_verstappen', 'hamilton')."
        tests:
          - not_null
          - unique
      - name: full_name
      - name: latest_constructor_id

  - name: dim_race
    description: "One row per race weekend (season, round)."
    columns:
      - name: race_id
        description: "Surrogate key: '<season>-<round>'."
        tests:
          - not_null
          - unique
      - name: season
        tests: [not_null]
      - name: round
        tests: [not_null]
      - name: race_date

  - name: fct_driver_race_summary
    description: "One row per (race, driver). Powers the Tier 1 dashboard."
    columns:
      - name: race_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_race')
                field: race_id
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: driver_id
      - name: position
      - name: grid
      - name: points
      - name: qualifying_position

  - name: vw_dashboard_overview
    description: "Flat dashboard-facing view. One row per (race, driver) with cumulative points and win/podium flags pre-computed. Powers the Looker Studio report."
    columns:
      - name: race_id
        tests: [not_null]
      - name: driver_id
        tests: [not_null]
      - name: cumulative_points
        description: "Running sum of season points up to and including this round."

  - name: fct_lap
    description: "OpenF1 lap-grain fact. One row per (session_key, driver_number, lap_number)."
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: lap_number
        tests: [not_null]
      - name: lap_time_ms
        tests: [not_null]

  - name: fct_driver_pace
    description: "Per-session, per-driver pace summary. pace_ratio = driver-median of (lap_time / field-median-for-that-lap-number); 1.000 = field median."
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: laps
      - name: median_lap_ms
      - name: pace_ratio
        description: "1.000 = exactly field median; <1.000 = faster; >1.000 = slower."

  - name: vw_dashboard_race
    description: "Flat dashboard view for the race deep-dive page. One row per (session, driver, lap) with display labels, pace_ratio, lap_time_s, and an outlier flag. Labels come from the driver_label / session_label macros (Tier-3 replacement target = real /drivers extractor + xref dim)."
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: lap_number
        tests: [not_null]

  - name: fct_clean_air_pace
    description: |
      Tier-3 headline metric: per (session, driver, compound) median lap time
      restricted to "clean-air" laps and corrected for fuel load.

      Clean-air definition (a deliberate Tier-3 simplification — see model SQL):
        * the lap maps to a stint with a known compound
        * lap > stint.lap_start (excludes out-laps)
        * lap_time <= 1.25 × session-median for that lap_number (defensible
          proxy that catches both safety-car laps AND slow in-laps without
          needing /race_control or pit-in detection)

      Fuel correction: lap_time - 30ms × laps_remaining_in_session. Standard
      literature approximation; not real telemetry.

      pace_ratio = driver-median / field-median for that (session, compound).
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: compound
        tests: [not_null]
      - name: pace_ratio
        description: "1.000 = field median for this (session, compound); <1.000 = faster."

  - name: vw_dashboard_pace_by_compound
    description: "Flat dashboard view for the optional pace-by-compound page. Wraps fct_clean_air_pace with driver_label and session_label."
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: compound
        tests: [not_null]

  - name: vw_dashboard_live
    description: |
      "Live" race state. Auto-picks the session with the most recent lap
      timestamp from fct_lap, so during a real session window this is
      near-live (within ~2 min of the OpenF1 poller cadence + Looker
      refresh) and off-season it shows the most recently completed race.

      One row per driver in the latest session. Includes current stint
      compound, tire_age_laps (laps since current stint started),
      last_5_laps_avg_ms, pace_ratio, and an is_live_proxy boolean
      (true iff latest lap timestamp is within the last 2 hours of now).

      The off-season replay job that PLAN.md mentions (re-publish a
      historical race on a wall-clock cadence) is deferred to Phase 14.b
      as future work. The auto-pick approach gives the same end-user
      value with zero new infrastructure.
    columns:
      - name: session_key
        tests: [not_null]
      - name: driver_number
        tests: [not_null]
      - name: latest_lap_number
        tests: [not_null]
