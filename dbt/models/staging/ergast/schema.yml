version: 2

models:
  - name: stg_ergast__races
    description: "One row per race weekend (season, round)."
    columns:
      - name: season
        tests: [not_null]
      - name: round
        tests: [not_null]

  - name: stg_ergast__results
    description: "One row per (season, round, driver) race result."
    columns:
      - name: driver_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: round
        tests: [not_null]

  - name: stg_ergast__qualifying
    description: "One row per (season, round, driver) qualifying entry."
    columns:
      - name: driver_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: round
        tests: [not_null]

  - name: stg_ergast__drivers
    description: "One row per driver."
    columns:
      - name: driver_id
        tests:
          - not_null
          - unique

  - name: stg_ergast__driver_standings
    description: "Latest championship standing per (season, driver)."
    columns:
      - name: driver_id
        tests: [not_null]
      - name: season
        tests: [not_null]
